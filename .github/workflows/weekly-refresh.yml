name: Weekly card-data refresh (kick off)

# Stage 1 of 3. Fetches every active card's issuer document, hashes it, and submits
# an Anthropic Message Batch for ONLY the cards whose source bytes actually moved.
#
# Why this is split across three workflows instead of one:
#   A synchronous 380-card sweep was measured at ~11.6 hours. GitHub Actions kills a
#   job at 6. The Batch API decouples submission from completion — this job submits
#   and exits in minutes, `pipeline-advance.yml` collects whenever the batch finishes.
#   No job ever approaches the limit, and a run that dies mid-way loses nothing,
#   because the batch keeps processing on Anthropic's side.
#
# This repo is PUBLIC, so Actions minutes here are free.

on:
  schedule:
    - cron: '0 3 * * 1'      # Mondays 03:00 UTC = 08:30 IST
  workflow_dispatch:
    inputs:
      card_id:
        description: 'Refresh a single card (blank = all active cards)'
        required: false
        default: ''
      limit:
        description: 'Stop after N cards. Blank = no limit.'
        required: false
        default: ''
      force:
        description: 'Ignore content hashes and re-extract everything (EXPENSIVE — full sweep)'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'Fetch and diff, but submit nothing and spend nothing'
        type: boolean
        required: false
        default: false
      max_usd:
        description: 'Raise this CYCLE spend ceiling for this run only, in USD. Blank = the MAX_CYCLE_USD in pipeline/config.py. YOU MUST PASS THE SAME NUMBER to the Pipeline advance workflow, or the extraction is paid for and never verified.'
        required: false
        default: ''

# Two overlapping refreshes would fight over the same state file and could submit
# the same cards twice. Never cancel in progress — a killed submit can orphan a
# batch we have already paid for.
defaults:
  run:
    # GitHub's default step shell is `bash -e {0}` — no pipefail. Every step here pipes
    # the CLI into `tee`, so without this the step's exit status is tee's and is always
    # 0: a crashed run, a missing SDK, `advance` exiting 1, all report success. That is
    # exactly how this repo's predecessor scanner failed 12 Mondays in a row while every
    # job showed green.
    shell: bash -euo pipefail {0}

concurrency:
  group: kredme-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  submit:
    name: Fetch sources and submit extraction batch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pdftotext. Issuer T&Cs are overwhelmingly Flate-compressed PDFs, and the
      # generic HTML fetchers report those as empty or corrupt — a tooling failure
      # that reads exactly like "the bank publishes nothing". poppler reads them.
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Install the one non-stdlib dependency
        run: pip install --quiet -r pipeline/requirements.txt

      - name: Fail early if the API key is missing
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set on this repository."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            echo "It must be on kredme-data/kredme-data — a key on any other repo has no effect."
            exit 2
          fi

      - name: Self-tests (never submit a batch from broken code)
        run: python3 tools/test_pipeline.py && python3 tests/run_all.py

      # WHAT THIS RUN MAY SPEND, printed before it can spend it.
      #
      # The ceiling is NOT passed as a flag here, and that is the point. `limit` and
      # `dry_run` above are workflow_dispatch inputs, so on the scheduled Monday run
      # they are empty and any ceiling expressed as a flag would silently not apply —
      # which is how this job came to be unattended and uncapped. The ceiling lives in
      # pipeline/config.py instead, where batch.submit() reads it by default and every
      # path gets it, scheduled or manual.
      #
      # That also means one edit is enough to change it: this workflow checks out
      # `dev`, so MAX_CYCLE_USD on dev is what Monday enforces, and no workflow file
      # has to be synced to main for a new number to take effect.
      #
      # `max_usd` above is the one-run override, and it exists because the PR that
      # introduced this ceiling told the founder to "run the workflow by hand with
      # --max-usd 50" when there was no input and no workflow anywhere appended the
      # flag. Advice that cannot be followed is worse than no advice. It is a CYCLE
      # number and it must be given to pipeline-advance too — that warning is on the
      # input's own description and repeated here.
      - name: Show the spend ceiling this run will enforce
        run: |
          OVERRIDE='${{ github.event.inputs.max_usd }}'
          CEILING=$(python3 -c 'from pipeline import config; print(f"{config.MAX_CYCLE_USD:.2f}")')
          SOURCE='pipeline/config.py, MAX_CYCLE_USD'
          if [ -n "$OVERRIDE" ]; then CEILING="$OVERRIDE"; SOURCE='the max_usd input on this run'; fi
          echo "Cycle spend ceiling: \$$CEILING ($SOURCE)"
          {
            echo "## Spend ceiling"
            echo
            echo "This CYCLE may submit at most **\$$CEILING** of model work — the extraction batch"
            echo "here AND the verification batch \`Pipeline advance\` submits about two hours later,"
            echo "together. Above that it refuses outright and spends nothing; it does not trim the"
            echo "batch to fit. Source: $SOURCE."
            echo
            echo "To change it permanently: edit \`MAX_CYCLE_USD\` in \`pipeline/config.py\` and merge to \`dev\`."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$OVERRIDE" ]; then
            echo "::warning title=Cycle ceiling overridden::This run uses \$$OVERRIDE instead of the configured ceiling. Pass the SAME number to the 'Pipeline advance' workflow when it collects, or the extraction is paid for and the verification refuses."
            echo "> :warning: Overridden for this run only. Pass \`max_usd = $OVERRIDE\` to **Pipeline advance** as well, or the extraction is paid for and never verified." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fetch sources and submit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Explicit ifs, not `[ test ] && assign`: under `set -e` a false test makes the
          # whole line non-zero and kills the step, and an empty optional input is the
          # normal case on a scheduled run.
          ARGS=""
          if [ -n "${{ github.event.inputs.card_id }}" ]; then ARGS="$ARGS --card-id ${{ github.event.inputs.card_id }}"; fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ github.event.inputs.max_usd }}" ]; then ARGS="$ARGS --max-usd ${{ github.event.inputs.max_usd }}"; fi
          echo "Running: pipeline/cli.py refresh $ARGS"
          # -u, not plain python3. Piping into `tee` makes stdout a pipe, and
          # Python block-buffers a pipe at ~8 KB. Run 31991962860 printed
          # "Running: ..." and then nothing for the 60 minutes before the job
          # timeout killed it — the progress lines existed, they were sitting in
          # a buffer that never flushed because the process never exited. The
          # step summary below reads refresh.log and was empty for the same
          # reason. Unbuffered, a stall is visible at the card it stalled on.
          python3 -u pipeline/cli.py refresh $ARGS | tee refresh.log

      # Head AND tail. `sed -n '1,120p'` alone shows the first 120 lines, and on a
      # 350-card week the unresolved-source warnings and the per-host fetch failures
      # can fill those on their own — so the verdict at the END of the run (the cost,
      # and any spend refusal) was exactly the part that could be cut off. The CLI
      # also writes its own block straight into this summary when it refuses, so a
      # refusal now has two independent routes to the reader.
      - name: Job summary
        if: always()
        run: |
          {
            echo '## Weekly refresh — stage 1 of 3'
            echo
            echo '### First 120 lines'
            echo '```'
            sed -n '1,120p' refresh.log 2>/dev/null || echo 'no log produced'
            echo '```'
            echo '### Last 40 lines — the verdict and the cost'
            echo '```'
            tail -n 40 refresh.log 2>/dev/null || echo 'no log produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The content hashes and the batch handle are committed so stage 2 can find
      # them. Nothing here touches seed/ — no card data changes until a human
      # merges the PR that stage 3 opens.
      - name: Commit pipeline state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  'kredme-pipeline[bot]'
          git config user.email 'kredme-pipeline@users.noreply.github.com'
          if git diff --quiet -- pipeline/state; then
            echo 'No state change — nothing to commit.'
            exit 0
          fi
          git add pipeline/state
          git commit -m 'Record this week source hashes and the extraction batch handle'
          git push origin HEAD:dev
