name: Pipeline advance (poll batches, open PR)

# Stages 2 and 3. Runs on a short cycle, does nothing and exits in seconds unless a
# batch is actually in flight.
#
#   stage 2  extraction batch ended  ->  collect results, submit the VERIFICATION batch
#   stage 3  verification batch ended ->  collect, diff against seed/cards.json,
#                                         apply only what passes the gate, open a PR to dev
#
# Verification is a separate batch, not a second half of the first prompt, because the
# adversary has to see the extractor's output. Measured on a known-answer control, a
# single pass got 100% of its numbers right and 78% of its "I could not find this"
# claims wrong — a one-pass pipeline ships correct rates alongside a false all-clear,
# which is the more expensive error.
#
# The PR is deliberate. Of 18 changes that a first pass called "confirmed at the
# issuer", an adversarial second pass refuted 6 — a wrong effective date, an
# overstated card list, a superseded source document. An unattended publish would
# have shipped those to users. A human merges.

on:
  schedule:
    - cron: '17 */2 * * *'   # every 2 hours, offset so it never collides with the kick-off
  workflow_dispatch:

defaults:
  run:
    # GitHub's default step shell is `bash -e {0}` — no pipefail. Every step here pipes
    # the CLI into `tee`, so without this the step's exit status is tee's and is always
    # 0: a crashed run, a missing SDK, `advance` exiting 1, all report success. That is
    # exactly how this repo's predecessor scanner failed 12 Mondays in a row while every
    # job showed green.
    shell: bash -euo pipefail {0}

concurrency:
  group: kredme-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # statuses: write is for the gate below. The PR this job opens is created with the
  # default GITHUB_TOKEN, and GitHub deliberately does not fire `on: pull_request`
  # workflows for those — measured, not assumed: PR #62 shows "no checks reported",
  # while the human-opened #61 next to it shows "Self-tests + data validation".
  # So this job runs the gate itself and PUBLISHES the result as a commit status,
  # which is a real, visible check that branch protection on `dev` can require.
  statuses: write

jobs:
  advance:
    name: Advance whatever stage is pending
    runs-on: ubuntu-latest
    # 60, not 30. A timeout here is not a slow job that retries cheaply — the
    # run at 17:12 on 2026-08-17 collected 371 extractions we had already paid
    # ~$45 for, then was killed at exactly 30 minutes while re-reading sources,
    # so `Commit state` never ran and all of it was discarded. The re-read is
    # concurrent now and should finish well inside 30, but the cost of being
    # wrong is asymmetric: idle minutes on a public repo are free, and a kill
    # throws away paid work.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      # Cheap gate: on most of the 84 runs a week there is no batch in flight, and
      # this exits before installing anything.
      - name: Is anything pending?
        id: gate
        run: |
          if [ ! -f pipeline/state/batch.json ]; then
            echo 'pending=false' >> "$GITHUB_OUTPUT"; echo 'No batch state file.'; exit 0
          fi
          if python3 -c "import json,sys; d=json.load(open('pipeline/state/batch.json')); sys.exit(0 if any(b.get('status')=='submitted' for b in d.get('batches',[])) else 1)"; then
            echo 'pending=true' >> "$GITHUB_OUTPUT"; echo 'A batch is in flight.'
          else
            echo 'pending=false' >> "$GITHUB_OUTPUT"; echo 'Nothing pending.'
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.pending == 'true'
        with:
          python-version: '3.12'

      # pdftotext, exactly as weekly-refresh installs it — and for a sharper
      # reason here. Verification re-reads each source and requires the text to
      # hash IDENTICALLY to what extraction read. fetch_source appends the text
      # of every linked PDF, so without poppler that text silently disappears
      # and the hash cannot match. It does not look like a missing tool; it
      # looks like the bank rewrote its page.
      #
      # Measured on the 17-Aug run, which had 371 paid-for extractions in hand:
      # 205 cards reported "source changed since extraction" and 27 more
      # "no text extracted from PDF". 232 of 371 discarded, and the batch
      # proposed nothing at all. hdfc millennia alone is 114,738 characters
      # with its 4 linked PDFs and 13,115 without — different bytes, different
      # hash, every time.
      - name: Install poppler-utils
        if: steps.gate.outputs.pending == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Install dependencies
        if: steps.gate.outputs.pending == 'true'
        run: pip install --quiet -r pipeline/requirements.txt

      - name: Advance
        if: steps.gate.outputs.pending == 'true'
        id: advance
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo '::error::ANTHROPIC_API_KEY is not set — cannot collect an in-flight batch.'; exit 2
          fi
          # -u: see weekly-refresh.yml. Piping into `tee` block-buffers stdout,
          # so a run that stalls or is killed shows an empty log and an empty
          # step summary regardless of how much it printed.
          python3 -u pipeline/cli.py advance | tee advance.log
          # cli.py writes 'stage=<name>' to GITHUB_OUTPUT itself when it produces a patch.
          # grep exiting 1 means "not found", not "failed" — spell that out so it reads
          # correctly under `set -o pipefail`.
          if grep -q 'PATCH_READY' advance.log; then
            echo 'patch=true' >> "$GITHUB_OUTPUT"
          else
            echo 'patch=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Job summary
        if: steps.gate.outputs.pending == 'true'
        run: |
          {
            echo '## Pipeline advance'
            echo
            sed -n '1,150p' advance.log 2>/dev/null || echo 'no log'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit state
        if: steps.gate.outputs.pending == 'true'
        run: |
          git config user.name  'kredme-pipeline[bot]'
          git config user.email 'kredme-pipeline@users.noreply.github.com'
          git add pipeline/state
          git diff --cached --quiet || git commit -m 'Advance pipeline state'
          git push origin HEAD:dev || true

      # The pipeline proposes card data. Until now the only thing standing between a
      # model's proposal and a reviewer was tools/kredme.py, which on the same file
      # found 1 defect where the nine-layer validator found 616. So every proposed
      # change is now measured by the real validator before a human is asked to read
      # it, and the numbers go in the PR body.
      #
      # Deliberately NOT blocking. The backlog is in the hundreds, so failing here
      # would simply stop the pipeline opening PRs at all, and a lane that never
      # opens a PR is a lane nobody fixes. The job of this step is to make sure no
      # proposed change reaches a reviewer unmeasured.
      #
      # (Carried over from main. This file had drifted: main gained this step in PR
      # #59 and dev never did, so a dev -> main workflow sync would have deleted it.)
      - name: Measure the proposed change with the full validator
        if: steps.advance.outputs.patch == 'true'
        id: measure
        continue-on-error: true
        run: |
          python3 tools/validate_cards.py --quiet --json /tmp/after.json || true
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, collections, pathlib
          rep = json.load(open('/tmp/after.json'))
          f = rep['findings']
          by = collections.Counter(x['code'] for x in f if x['severity'] == 'ERROR')
          base = {}
          p = pathlib.Path('tools/validated_baseline.json')
          if p.exists():
              base = json.loads(p.read_text()).get('errors_by_code', {})
          now = sum(by.values())
          was = sum(base.values()) if base else None
          print('### Validator on this proposed change\n')
          print(f'**{now} errors**' + (f' (baseline {was})' if was is not None else '') + '\n')
          worse = [(c, n, base.get(c, 0)) for c, n in by.items() if n > base.get(c, 0)]
          if worse:
              print('| code | now | baseline |\n|---|---:|---:|')
              for c, n, b in sorted(worse, key=lambda x: -(x[1] - x[2])):
                  print(f'| `{c}` | {n} | {b} |')
              print('\n**This change makes the above worse. Read it carefully.**')
          else:
              print('No error code got worse than the recorded baseline.')
          print('\n_Measured, not enforced — this step never blocks the pipeline._')
          PY

      # ------------------------------------------------------------------ #
      # THE GATE. This runs BEFORE the PR is opened, on the working tree that is
      # about to become the PR, because that tree is the change.
      #
      # These are the exact commands validate.yml runs on a human's PR. They are
      # duplicated here rather than relied upon, for a measured reason: a PR opened
      # with the default GITHUB_TOKEN does not fire `on: pull_request` workflows, so
      # validate.yml never sees this PR at all. `gh pr checks 62` reports "no checks
      # reported on the branch"; the human-opened #61 beside it reports
      # "Self-tests + data validation SUCCESS". Arming auto-merge on a PR with zero
      # checks is not "CI gates it", it is merging blind.
      #
      # continue-on-error, because a failing gate must still leave a PR for a person
      # to read. It just must not merge itself.
      # ------------------------------------------------------------------ #
      - name: Gate the proposed change
        if: steps.advance.outputs.patch == 'true'
        id: gate
        continue-on-error: true
        run: |
          python3 tools/test_pipeline.py
          python3 tools/test_validate_cards.py
          python3 tools/test_fix_cards.py
          python3 tests/run_all.py
          python3 tools/kredme.py validate --target working

      # Only reached at stage 3, when there is an actual proposed change to review.
      # Base is dev, never main: data flows dev -> validate -> promote -> main, and
      # promoting is a separate deliberate act.
      - name: Open PR with the proposed data changes
        if: steps.advance.outputs.patch == 'true'
        id: cpr
        # Pinned to a commit, not the mutable `v6` tag. This repo is public and this
        # action runs in a job that holds a write-scoped GITHUB_TOKEN, so a repointed
        # tag would be arbitrary code with commit rights. SHA = v6.
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c
        with:
          # Same fallback data-quality.yml already uses. With PIPELINE_PR_TOKEN set
          # (a PAT or GitHub App installation token) the PR is opened by a real
          # identity and validate.yml runs on it for real; without it, the gate step
          # above and the commit status below are the only checks this PR gets.
          # The secret is NOT set today.
          token: ${{ secrets.PIPELINE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          base: dev
          branch: bot/card-refresh-${{ github.run_id }}
          delete-branch: true
          add-paths: |
            seed/cards.json
            seed/manifest.json
            pipeline/state/*
          commit-message: 'Refresh card data from issuer documents (run ${{ github.run_id }})'
          title: 'Weekly refresh: issuer-sourced card data changes'
          body-path: .pipeline-work/pr_body.md
          labels: card-refresh, auto-merge-to-dev

      # ------------------------------------------------------------------ #
      # PUBLISH THE GATE RESULT AS A COMMIT STATUS.
      #
      # This is what turns the in-job gate into something GitHub itself can enforce.
      # Once it exists on the head commit it shows on the PR like any other check,
      # and branch protection on `dev` can be set to REQUIRE the context
      # "pipeline gate" — at which point auto-merge below is gated by GitHub rather
      # than by this job's goodwill.
      # ------------------------------------------------------------------ #
      - name: Publish the gate result on the PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
          RESULT: ${{ steps.gate.outcome }}
        run: |
          if [ "$RESULT" = 'success' ]; then STATE=success; DESC='self-tests + data validation passed'; else STATE=failure; DESC='self-tests or data validation FAILED — not merging'; fi
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state="$STATE" \
            -f context='pipeline gate' \
            -f description="$DESC" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # ------------------------------------------------------------------ #
      # AUTO-MERGE INTO dev — and only ever into dev.
      #
      # The founder's rule: the pipeline's PR may land on `dev` by itself; reaching
      # users stays a deliberate human act. Nothing here publishes. `dev` is not the
      # default branch, the app does not read it, and promoting dev -> main is a
      # separate command a person runs.
      #
      # This uses GitHub's OWN auto-merge (`gh pr merge --auto`), which queues the
      # merge and lets branch protection and required checks decide when — or
      # whether — it happens. It is deliberately NOT `gh pr merge` on its own, and
      # never `--admin`: both of those merge immediately and step over exactly the
      # gates this is supposed to respect. If the gate above failed, we do not even
      # arm it, and the PR simply stays open for a human.
      # ------------------------------------------------------------------ #
      - name: Let GitHub merge it into dev
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          GATE: ${{ steps.gate.outcome }}
        run: |
          URL="${{ steps.cpr.outputs.pull-request-url }}"

          if [ "$GATE" != 'success' ]; then
            echo "::warning title=Gate failed — PR left open::PR #$PR did not pass the gate, so auto-merge was NOT armed. A human must read it."
            echo "- :warning: **PR [#$PR]($URL) left open** — the gate failed, so it was not armed for auto-merge." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Belt and braces on the base branch. `base: dev` is already hard-coded in
          # the step above, but this is the last point before something merges, and
          # the cost of being wrong here is card data landing on main — the branch the
          # app actually reads. Read it back from the API and refuse anything else.
          BASE=$(gh pr view "$PR" --json baseRefName --jq .baseRefName)
          if [ "$BASE" != 'dev' ]; then
            echo "::error title=Refusing to auto-merge::PR #$PR targets '$BASE', not dev. Nothing was merged."
            exit 1
          fi

          if gh pr merge "$PR" --auto --squash; then
            echo "Auto-merge armed on PR #$PR (base $BASE)."
            echo "- :white_check_mark: **PR [#$PR]($URL)** armed for auto-merge into \`dev\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The usual cause is repository setting "Allow auto-merge" being off, which
          # it is today (`gh api repos/:owner/:repo --jq .allow_auto_merge` -> false).
          # There is no fallback here on purpose: merging directly instead would be
          # the force-merge this step exists to avoid.
          echo "::warning title=Auto-merge unavailable::Could not arm auto-merge on PR #$PR. It is open and waiting for a human. Enable Settings -> General -> Pull Requests -> Allow auto-merge."
          {
            echo "- :warning: **PR [#$PR]($URL)** could not be armed for auto-merge and is waiting for a human."
            echo "  Turn on **Settings → General → Pull Requests → Allow auto-merge**, and add branch protection on \`dev\` requiring the **\`pipeline gate\`** check."
          } >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --body "Auto-merge could not be armed on this PR, so it is waiting for a human. Repository setting **Allow auto-merge** is off. Nothing was merged and nothing was published." || true
